[profile.default]
src      = "contracts"
out      = "forge-out"
libs     = ["node_modules", "../lib"]
test     = "forge-tests"
cache_path = "forge-cache"

solc             = "0.8.25"
auto_detect_solc = true
optimizer        = true
optimizer_runs   = 200
via_ir           = true

remappings = [
    "forge-std/=../lib/forge-std/src/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "@tokenysolutions/t-rex/=node_modules/@tokenysolutions/t-rex/",
    "@fhenixprotocol/cofhe-contracts/=node_modules/@fhenixprotocol/cofhe-contracts/",
]

# ── Fuzz / Invariant defaults ──────────────────────────────────────────────────
[profile.default.fuzz]
runs    = 1000        # runs per fuzz test
max_test_rejects = 65536

[profile.default.invariant]
runs    = 500
depth   = 100         # calls per run
fail_on_revert = false

# ── CI profile (faster) ───────────────────────────────────────────────────────
[profile.ci]
fuzz    = { runs = 5000 }
invariant = { runs = 1000, depth = 200 }

# ── Exclude Hardhat artifacts from Forge ──────────────────────────────────────
[profile.default.model_checker]
contracts = {}
